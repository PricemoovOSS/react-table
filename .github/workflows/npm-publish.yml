name: NPM Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # setup-node writes an .npmrc that reads NODE_AUTH_TOKEN and yarn 1 refuses it while the variable is
      # unset: a placeholder until the publish step, the only one that gets the token
      NODE_AUTH_TOKEN: XXXXX-XXXXX-XXXXX-XXXXX
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: yarn install --frozen-lockfile
      - run: yarn test --ci
      - run: yarn build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
