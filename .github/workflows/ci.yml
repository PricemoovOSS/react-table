name: CI

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # node-sass 7 does not build on the runner's default Node 24 (nan / V8 API).
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Run tests
        run: |
          yarn install --frozen-lockfile
          yarn test
          yarn lint
